<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do - NScript</title>
  <style>
    :root {
      --color-primary: #2564cf;
      --color-primary-hover: #1a4fa0;
      --color-bg: #f3f2f1;
      --color-sidebar: #faf9f8;
      --color-center: #ffffff;
      --color-detail: #faf9f8;
      --color-border: #edebe9;
      --color-text: #323130;
      --color-text-secondary: #605e5c;
      --color-completed: #a19f9d;
      --color-important: #d13438;
      --color-selected-bg: #edebe9;
      --color-hover-bg: #f3f2f1;
      --color-checkbox: #2564cf;
      --sidebar-width: 280px;
      --detail-width: 360px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      overflow: hidden;
    }

    #app {
      height: 100vh;
    }

    .todo-app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Template root (data-test="1") needs flex too */
    [data-test="1"] {
      display: flex;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app" class="todo-app"></div>
  <script src="GeneratedScripts/TodoApp.js" type="text/javascript"></script>
</body>
</html>
