<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do - NScript</title>
  <style>
    :root {
      --color-primary: #2564cf;
      --color-primary-hover: #1a4fa0;
      --color-bg: #f3f2f1;
      --color-sidebar: #faf9f8;
      --color-center: #ffffff;
      --color-detail: #faf9f8;
      --color-border: #edebe9;
      --color-text: #323130;
      --color-text-secondary: #605e5c;
      --color-completed: #a19f9d;
      --color-important: #d13438;
      --color-selected-bg: #edebe9;
      --color-hover-bg: #f3f2f1;
      --color-checkbox: #2564cf;
      --sidebar-width: 280px;
      --detail-width: 360px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      overflow: hidden;
    }

    #app {
      height: 100vh;
    }

    .todo-app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Template root (data-test="1") needs flex too */
    [data-test="1"] {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ─── LEFT PANE (folder sidebar) ─── */
    .pane-left {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--color-sidebar);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s ease, min-width 0.2s ease;
    }

    .pane-left.collapsed {
      width: 0;
      min-width: 0;
      border-right: none;
    }

    /* ─── CENTER PANE (todo list) ─── */
    .pane-center {
      flex: 1;
      background: var(--color-center);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ─── RIGHT PANE (task detail) ─── */
    .pane-right {
      width: var(--detail-width);
      min-width: var(--detail-width);
      background: var(--color-detail);
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: width 0.2s ease, min-width 0.2s ease;
    }

    .pane-right.collapsed {
      width: 0;
      min-width: 0;
      border-left: none;
      overflow: hidden;
    }

    /* ─── PANE HEADERS ─── */
    .pane-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      min-height: 52px;
      border-bottom: 1px solid var(--color-border);
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-primary);
    }

    .current-folder-name {
      font-size: 20px;
      font-weight: 600;
      margin-left: 12px;
    }

    /* ─── TOGGLE / CLOSE BUTTONS ─── */
    .btn-toggle-left,
    .btn-close-detail {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--color-text-secondary);
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .btn-toggle-left:hover,
    .btn-close-detail:hover {
      background: var(--color-hover-bg);
      color: var(--color-text);
    }

    /* ─── FOLDER LIST ─── */
    .folder-list {
      padding: 8px 0;
      overflow-y: auto;
      flex: 1;
    }

    .folder-item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      margin: 1px 8px;
      transition: background 0.15s;
    }

    .folder-item:hover {
      background: var(--color-hover-bg);
    }

    .folder-item.selected {
      background: var(--color-selected-bg);
      font-weight: 600;
    }

    .folder-item.drag-over {
      background: rgba(37, 100, 207, 0.15);
      outline: 2px dashed var(--color-primary);
      outline-offset: -2px;
    }

    .folder-icon {
      margin-right: 10px;
      font-size: 16px;
      width: 20px;
      text-align: center;
    }

    .folder-name {
      flex: 1;
      font-size: 14px;
    }

    .folder-count {
      font-size: 12px;
      color: var(--color-text-secondary);
      background: var(--color-border);
      border-radius: 10px;
      padding: 1px 6px;
    }

    /* ─── TODO LIST ─── */
    .todo-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 4px;
      margin: 1px 8px;
      transition: background 0.15s;
    }

    .todo-item:hover {
      background: var(--color-hover-bg);
    }

    .todo-item.selected {
      background: var(--color-selected-bg);
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: var(--color-completed);
    }

    .btn-check {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border: 2px solid var(--color-text-secondary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-right: 12px;
      font-size: 12px;
      color: transparent;
    }

    .btn-check:hover {
      border-color: var(--color-primary);
    }

    .btn-check.checked {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: white;
    }

    /* ─── CHECKBOX ─── */
    .todo-check, .sub-check {
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-checkbox);
      border-radius: 50%;
      background: none;
      cursor: pointer;
      margin-right: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: transparent;
      transition: background 0.15s, color 0.15s;
    }

    .todo-check:hover, .sub-check:hover {
      background: rgba(37, 100, 207, 0.1);
    }

    .todo-item.completed .todo-check,
    .subtask-item.completed .sub-check {
      background: var(--color-checkbox);
      color: white;
      border-color: var(--color-checkbox);
    }

    .todo-title {
      flex: 1;
      font-size: 14px;
    }

    .btn-toggle-left, .btn-close-detail {
      cursor: pointer;
      font-size: 18px;
      color: var(--color-text-secondary);
      padding: 4px 8px;
    }

    /* ─── STAR / IMPORTANCE ─── */
    .star {
      font-size: 16px;
      padding: 2px 4px;
      cursor: pointer;
      color: var(--color-text-secondary);
      border-radius: 3px;
    }

    .star:hover {
      color: var(--color-important);
    }

    .star.important {
      color: var(--color-important);
    }

    /* ─── COMPLETED SECTION ─── */
    .completed-section {
      border-top: 1px solid var(--color-border);
      margin-top: 8px;
    }

    .completed-header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .completed-header:hover {
      background: var(--color-hover-bg);
    }

    .completed-toggle {
      margin-right: 8px;
      font-size: 10px;
      transition: transform 0.2s;
    }

    .completed-section:not(.collapsed) .completed-toggle {
      transform: rotate(90deg);
    }

    .completed-section.collapsed .completed-list {
      display: none;
    }

    .completed-section.hidden {
      display: none;
    }

    /* ─── ADD TASK BAR ─── */
    .add-todo-bar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--color-border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-todo-bar:hover {
      background: var(--color-hover-bg);
    }

    .add-icon {
      font-size: 20px;
      color: var(--color-primary);
      margin-right: 10px;
      font-weight: 300;
    }

    .add-text {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .add-task-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      background: transparent;
      color: var(--color-text);
      font-family: inherit;
    }

    .add-task-input::placeholder {
      color: var(--color-text-secondary);
    }

    /* ─── TASK DETAIL PANE ─── */
    .task-detail {
      padding: 16px;
    }

    .detail-title-input {
      width: 100%;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text);
      border: none;
      border-bottom: 2px solid transparent;
      outline: none;
      padding: 4px 0;
      margin-bottom: 16px;
      background: transparent;
      font-family: inherit;
    }

    .detail-title-input:focus {
      border-bottom-color: var(--color-primary);
    }

    .detail-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--color-text);
    }

    .detail-section {
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .section-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }

    .section-icon {
      margin-right: 8px;
    }

    /* ─── SUBTASK ITEMS ─── */
    .subtask-item {
      display: flex;
      align-items: center;
      padding: 6px 0;
    }

    .subtask-item.completed .subtask-title {
      text-decoration: line-through;
      color: var(--color-completed);
    }

    .subtask-title {
      font-size: 14px;
      flex: 1;
    }

    .subtask-title-input {
      font-size: 14px;
      flex: 1;
      border: none;
      background: transparent;
      color: var(--color-text);
      padding: 2px 4px;
      outline: none;
    }

    .subtask-title-input:focus {
      border-bottom: 1px solid var(--color-primary);
    }

    .subtask-item.completed .subtask-title-input {
      text-decoration: line-through;
      color: var(--color-completed);
    }

    /* ─── ADD SUBTASK ─── */
    .add-subtask-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--color-primary);
      font-size: 14px;
    }

    .add-step-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--color-text);
      font-size: 14px;
      outline: none;
      padding: 4px;
    }

    .add-step-input::placeholder {
      color: var(--color-primary);
    }

    .add-subtask {
      display: flex;
      align-items: center;
      padding: 6px 0;
      cursor: pointer;
      color: var(--color-text-secondary);
      font-size: 14px;
    }

    .add-subtask:hover {
      color: var(--color-primary);
    }

    /* ─── DUE DATE / MY DAY ─── */
    .detail-section.due-date,
    .detail-section.myday {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
    }

    .detail-section.myday.active {
      color: var(--color-primary);
    }

    /* ─── FOLDER PICKER ─── */
    .current-folder-label {
      font-size: 13px;
      color: var(--color-text-secondary);
      padding: 4px 0 8px 0;
    }

    .folder-pick-item {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
    }

    .folder-pick-item:hover {
      background: rgba(37, 100, 207, 0.1);
    }

    .folder-pick-icon {
      margin-right: 8px;
      font-size: 16px;
    }

    .folder-pick-name {
      flex: 1;
    }

    /* ─── DELETE TASK ─── */
    .detail-section.delete-section {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-top: 8px;
    }

    .detail-section.delete-section:hover {
      color: var(--color-important);
    }

    /* ─── ADD FOLDER BAR ─── */
    .add-folder-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border-top: 1px solid var(--color-border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .add-folder-bar:hover {
      background: var(--color-hover-bg);
    }
  </style>
</head>
<body>
  <div id="app" class="todo-app"></div>
  <script src="GeneratedScripts/TodoApp.js" type="text/javascript"></script>
</body>
</html>
